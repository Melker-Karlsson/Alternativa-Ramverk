<div>
    @if(!editing()){
        <h3>{{todoInfo()?.title}}</h3>
        <p>{{todoInfo()?.context}}</p>
        <button (click)="togleEditing()">Edit</button>
        <button>Delete</button>
    }
    @else {
        <form [formGroup]="todoForm" (ngSubmit)="onSubmitApplyEdits()">
            <label>
                title
                <input type="text" formControlName="Title" value="{{todoInfo()?.title}}">
            </label>
            <label>
                context
                <input type="text" formControlName="Context">
            </label>
            <button type="submit">Submit</button>
        </form>
    }
</div>
