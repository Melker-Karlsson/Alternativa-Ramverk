<div>
    @if(!editing()){
        <h3>{{todoInfo()?.title}}</h3>
        <p>{{todoInfo()?.context}}</p>
        <button (click)="togleEditing()">Edit</button>
        <button (click)="todoService.delete(todoInfo()!.id)">Delete</button>
    }
    @else {
        <form [formGroup]="todoForm" (ngSubmit)="todoService.update({
            id: todoInfo()!.id, 
            title: todoForm.value.Title ?? '', 
            context: todoForm.value.Context ?? ''}); togleEditing()">

            <label>
                title
                <input type="text" formControlName="Title">
            </label>
            <label>
                context
                <input type="text" formControlName="Context">
            </label>
            <button type="submit">Submit</button>
        </form>
    }
</div>
